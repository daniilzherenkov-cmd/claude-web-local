<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<style>
  :root {
    --bg: #f5f4ee;
    --bg-elev: #ffffff;
    --bg-pill: #f0eee6;
    --bg-inline-code: #ede9df;
    --text: #1f1e1c;
    --text-muted: #6b6a64;
    --text-faint: #8a8980;
    --border: #e5e3da;
    --border-strong: #c9c6ba;
    --accent: #cc785c;
    --accent-hover: #b8684f;
    --accent-active: #9d563f;
    --code-bg: #1e1e1e;
    --code-text: #e5e5e5;
    --code-muted: #8a8a85;
    --error-text: #b54a3a;
    --error-bg: #fbeae5;
    --error-border: #f0c9bd;
    --shadow-md: 0 2px 8px rgba(31, 30, 28, 0.06), 0 1px 2px rgba(31, 30, 28, 0.04);
    --shadow-lg: 0 16px 48px rgba(31, 30, 28, 0.14), 0 4px 12px rgba(31, 30, 28, 0.06);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-serif: ui-serif, Georgia, "Times New Roman", serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Topbar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 24px;
    border-bottom: 1px solid transparent;
    transition: border-color 200ms ease;
  }
  .topbar.scrolled { border-color: var(--border); }
  .wordmark {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
    user-select: none;
    margin-right: auto;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  .wordmark .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    transform: translateY(-1px);
  }
  .wordmark .dh-logo {
    height: 18px;
    width: auto;
    margin-left: 4px;
    vertical-align: middle;
    image-rendering: -webkit-optimize-contrast;
    transform: translateY(-2px);
    opacity: 0.95;
  }

  .model-select-wrap { position: relative; margin-right: 4px; }
  .model-select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-muted);
    padding: 6px 26px 6px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .model-select:hover { background: rgba(0, 0, 0, 0.03); color: var(--text); }
  .model-select:focus { outline: none; border-color: var(--border-strong); background: var(--bg-elev); color: var(--text); }
  .model-select-wrap::after {
    content: "";
    position: absolute;
    right: 11px;
    top: 50%;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid var(--text-faint);
    border-bottom: 1.5px solid var(--text-faint);
    transform: translateY(-75%) rotate(45deg);
    pointer-events: none;
  }

  .icon-btn {
    appearance: none;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    padding: 7px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 150ms ease, color 150ms ease;
  }
  .icon-btn:hover { background: rgba(0, 0, 0, 0.04); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }

  .new-chat-btn {
    appearance: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px 6px 9px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 150ms ease, border-color 150ms ease;
  }
  .new-chat-btn:hover { background: var(--bg-elev); border-color: var(--border-strong); }
  .new-chat-btn svg { width: 13px; height: 13px; }

  /* Main scroll area */
  .main {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .messages {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 220px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* Empty state */
  .empty-state {
    margin-top: 16vh;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .empty-state .accent-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-bottom: 18px;
  }
  .empty-state h1 {
    font-family: var(--font-serif);
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0;
  }
  .empty-state p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }

  /* Messages */
  .msg { animation: msg-in 280ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-user {
    align-self: flex-end;
    max-width: 80%;
    background: var(--bg-pill);
    border: 1px solid rgba(0, 0, 0, 0.04);
    padding: 12px 16px;
    border-radius: 18px;
    border-bottom-right-radius: 6px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg-assistant {
    align-self: stretch;
    font-family: var(--font-serif);
    font-size: 17px;
    line-height: 1.65;
    color: var(--text);
  }
  .msg-assistant > *:first-child { margin-top: 0; }
  .msg-assistant > *:last-child  { margin-bottom: 0; }
  .msg-assistant p { margin: 0 0 1em; }
  .msg-assistant h1, .msg-assistant h2, .msg-assistant h3 {
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-top: 1.4em;
    margin-bottom: 0.5em;
  }
  .msg-assistant h1 { font-size: 1.5em; }
  .msg-assistant h2 { font-size: 1.25em; }
  .msg-assistant h3 { font-size: 1.1em; }
  .msg-assistant ul, .msg-assistant ol { padding-left: 1.6em; margin: 0 0 1em; }
  .msg-assistant li { margin-bottom: 0.4em; }
  .msg-assistant a { color: var(--accent); text-underline-offset: 3px; }
  .msg-assistant blockquote {
    border-left: 3px solid var(--border-strong);
    padding-left: 1em;
    color: var(--text-muted);
    margin: 0 0 1em;
    font-style: italic;
  }
  .msg-assistant table { border-collapse: collapse; margin: 0 0 1em; font-family: var(--font-sans); font-size: 14px; }
  .msg-assistant th, .msg-assistant td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .msg-assistant th { background: var(--bg-pill); font-weight: 600; }

  /* Inline code */
  .msg-assistant code:not(pre code),
  .msg-user code {
    background: var(--bg-inline-code);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: var(--font-mono);
    color: var(--text);
  }

  /* Code blocks */
  .msg-assistant pre {
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.55;
    position: relative;
    margin: 0 0 1.2em;
  }
  .msg-assistant pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--code-muted);
    font-size: 11px;
    font-family: var(--font-sans);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    opacity: 0;
    transition: opacity 150ms ease, background 150ms ease, color 150ms ease;
  }
  .msg-assistant pre:hover .copy-btn,
  .copy-btn:focus { opacity: 1; }
  .copy-btn:hover { background: rgba(255, 255, 255, 0.12); color: var(--code-text); }
  .copy-btn.copied { color: #8acf8a; opacity: 1; }

  /* Streaming indicators */
  .streaming-caret {
    display: inline-block;
    width: 8px;
    height: 1.05em;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    border-radius: 1px;
    animation: caret-blink 1s steps(2, start) infinite;
  }
  @keyframes caret-blink { 50% { opacity: 0; } }

  .thinking-dots {
    display: inline-flex;
    gap: 5px;
    align-items: center;
    padding: 4px 0;
  }
  .thinking-dots span {
    width: 7px;
    height: 7px;
    background: var(--text-faint);
    border-radius: 50%;
    animation: dot-pulse 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes dot-pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40%           { opacity: 1;    transform: scale(1); }
  }

  .msg-error {
    color: var(--error-text);
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: var(--font-sans);
    align-self: stretch;
  }

  /* Composer */
  .composer-wrap {
    position: sticky;
    bottom: 0;
    padding: 0 24px 18px;
    background: linear-gradient(to top, var(--bg) 60%, rgba(245, 244, 238, 0));
    pointer-events: none;
  }
  .composer {
    pointer-events: auto;
    max-width: 760px;
    margin: 0 auto;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-md);
    padding: 12px 12px 12px 18px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .composer:focus-within {
    border-color: var(--border-strong);
    box-shadow: 0 4px 16px rgba(31, 30, 28, 0.08);
  }
  #composer-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    resize: none;
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    max-height: 240px;
    min-height: 24px;
    padding: 6px 0;
  }
  #composer-input::placeholder { color: var(--text-faint); }
  #send-btn {
    appearance: none;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 150ms ease, transform 100ms ease, opacity 150ms ease;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:active:not(:disabled) { transform: scale(0.95); background: var(--accent-active); }
  #send-btn:disabled { background: var(--border-strong); cursor: not-allowed; }
  #send-btn.is-streaming { background: #2c2c2a; }
  #send-btn.is-streaming:hover { background: #1a1a18; }
  #send-btn svg { width: 16px; height: 16px; }
  .composer-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 8px;
    user-select: none;
  }

  /* Settings dialog */
  dialog {
    border: none;
    padding: 0;
    background: transparent;
    color: inherit;
    max-width: 460px;
    width: calc(100% - 32px);
  }
  dialog::backdrop {
    background: rgba(31, 30, 28, 0.32);
    backdrop-filter: blur(2px);
  }
  dialog[open] { animation: dialog-in 200ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes dialog-in {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .dialog-card {
    background: var(--bg-elev);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 28px 28px 22px;
  }
  .dialog-title {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .dialog-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 20px;
    line-height: 1.5;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .field input {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 150ms ease, background 150ms ease;
  }
  .field input:focus { border-color: var(--accent); background: var(--bg-elev); }
  .field-hint { font-size: 12px; color: var(--text-faint); margin-top: 2px; line-height: 1.4; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 8px 18px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .btn-primary { background: var(--text); color: var(--bg-elev); }
  .btn-primary:hover { background: #000; }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: rgba(0, 0, 0, 0.04); color: var(--text); }

  /* Scrollbars */
  .main::-webkit-scrollbar { width: 12px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.08);
    border-radius: 10px;
    border: 3px solid var(--bg);
  }
  .main::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.18); }

  /* Responsive */
  @media (max-width: 640px) {
    .topbar { padding: 10px 14px; }
    .wordmark { font-size: 20px; }
    .new-chat-btn { padding: 6px 10px 6px 8px; }
    .messages { padding: 24px 16px 220px; }
    .composer-wrap { padding: 0 14px 12px; }
    .empty-state { margin-top: 12vh; }
    .empty-state h1 { font-size: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition: none !important; }
    .main { scroll-behavior: auto; }
  }
  /* ----- Tool cards (v2) ----- */
  .tool-card {
    align-self: stretch;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    font-family: var(--font-sans);
    font-size: 13px;
    box-shadow: var(--shadow-md);
  }
  .tool-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: var(--bg-pill);
    border-bottom: 1px solid var(--border);
  }
  .tool-card-name {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .tool-card-status {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.06);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tool-pending .tool-card-status { background: #fef9e7; color: #7a5e0d; }
  .tool-done    .tool-card-status { background: #e7f3ea; color: #2f7a3f; }
  .tool-error   .tool-card-status { background: #fbeae5; color: #8a3422; }
  .tool-card-body {
    padding: 12px 14px;
    background: var(--bg-elev);
  }
  .tool-card-input,
  .tool-card-result pre {
    margin: 0;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .tool-card-result {
    margin-top: 10px;
  }
  .tool-card-result summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 0;
    user-select: none;
  }
  .tool-card-result summary:hover { color: var(--text); }
  .tool-card-result[open] summary { margin-bottom: 6px; }

  /* ----- Permission cards (v2) ----- */
  .permission-card {
    align-self: stretch;
    background: #fef9e7;
    border: 1px solid #f0e0a8;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--text);
    box-shadow: var(--shadow-md);
  }
  .permission-card-header {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 8px;
  }
  .permission-card-tool {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--accent);
  }
  .permission-card-prompt {
    font-size: 12px;
    color: var(--text-muted);
  }
  .permission-card-summary {
    margin: 0 0 10px;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .permission-card-details {
    margin: 0 0 12px;
  }
  .permission-card-details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    user-select: none;
    padding: 2px 0;
  }
  .permission-card-details summary:hover { color: var(--text); }
  .permission-card-details pre {
    margin: 6px 0 0;
    background: var(--code-bg);
    color: var(--code-text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
  }
  .permission-card-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .permission-card-actions .btn { font-size: 13px; }
  .permission-card-decided {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
  }

</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="wordmark">
    Claude<span class="dot" aria-hidden="true"></span>

      id="composer-input"

</div>

      </div>

        <label for="cfg-token">API token</label>
        <input id="cfg-token" type="password" placeholder="sk-..." autocomplete="off">

        <button id="cfg-cancel" class="btn btn-ghost" type="button">Cancel</button>

      </div>
    </form>
  </div>
</dialog>

<script>
  /* =====================================================================
     UI scaffolding — composer behavior, dialog, copy buttons, scroll shadow.
     Chat / API logic is in the next <script> block (CHAT_LOGIC_PLACEHOLDER).
  ===================================================================== */

  const els = {
    main:           document.getElementById('main'),
    topbar:         document.getElementById('topbar'),
    messages:       document.getElementById('messages'),
    emptyState:     document.getElementById('empty-state'),
    modelSelect:    document.getElementById('model-select'),
    newChatBtn:     document.getElementById('new-chat-btn'),
    settingsBtn:    document.getElementById('settings-btn'),
    settingsDialog: document.getElementById('settings-dialog'),
    settingsForm:   document.getElementById('settings-form'),
    cfgBaseUrl:     document.getElementById('cfg-base-url'),
    cfgToken:       document.getElementById('cfg-token'),
    cfgSave:        document.getElementById('cfg-save'),
    cfgCancel:      document.getElementById('cfg-cancel'),
    composerForm:   document.getElementById('composer-form'),
    composerInput:  document.getElementById('composer-input'),
    sendBtn:        document.getElementById('send-btn'),
    iconSend:       document.getElementById('icon-send'),
    iconStop:       document.getElementById('icon-stop'),
  };

  // Auto-grow textarea
  function resizeInput() {
    els.composerInput.style.height = 'auto';
    els.composerInput.style.height = Math.min(els.composerInput.scrollHeight, 240) + 'px';
  }
  els.composerInput.addEventListener('input', () => {
    resizeInput();
    if (!els.sendBtn.classList.contains('is-streaming')) {
      els.sendBtn.disabled = !els.composerInput.value.trim();
    }
  });

  // Enter to submit, Shift+Enter for newline
  els.composerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      els.composerForm.requestSubmit();
    }
  });

  // Subtle border on the topbar once the user has scrolled
  els.main.addEventListener('scroll', () => {
    els.topbar.classList.toggle('scrolled', els.main.scrollTop > 4);
  });

  // Settings dialog open / close
  els.settingsBtn.addEventListener('click', () => {
    els.settingsDialog.showModal();
    setTimeout(() => els.cfgBaseUrl.focus(), 50);
  });
  els.cfgCancel.addEventListener('click', () => els.settingsDialog.close());

  // Code-block copy (event delegation — works for streamed-in blocks too)
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const pre = btn.closest('pre');
    if (!pre) return;
    const code = (pre.querySelector('code')?.innerText) || pre.innerText;
    try {
      await navigator.clipboard.writeText(code);
      const orig = btn.textContent;
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
    } catch { /* clipboard blocked */ }
  });

  // Tiny helper exported for the chat-logic script to use
  window.__ui = {
    els,
    resizeInput,
    setStreaming(on) {
      els.sendBtn.classList.toggle('is-streaming', on);
      els.iconSend.style.display = on ? 'none' : '';
      els.iconStop.style.display = on ? '' : 'none';
      els.sendBtn.disabled = on ? false : !els.composerInput.value.trim();
      els.sendBtn.setAttribute('aria-label', on ? 'Stop' : 'Send message');
    },
    hideEmptyState() {
      if (els.emptyState && els.emptyState.parentNode) {
        els.emptyState.remove();
      }
    },
    showEmptyState() {
      if (!document.getElementById('empty-state')) {
        const div = document.createElement('div');
        div.className = 'empty-state';
        div.id = 'empty-state';
        div.innerHTML = `
          <span class="accent-dot" aria-hidden="true"></span>
          <h1>Hi, how can I help you today?</h1>
          <p>Connected to your Delivery Hero LiteLLM proxy.</p>`;
        els.messages.appendChild(div);
        els.emptyState = div;
      }
    },
    scrollToBottom(force = false) {
      const distance = els.main.scrollHeight - els.main.scrollTop - els.main.clientHeight;
      if (force || distance < 220) {
        els.main.scrollTop = els.main.scrollHeight;
      }
    },
  };
</script>

<script>
(() => {
  const ui = window.__ui;
  const els = ui.els;

  // ----- State -----
  let sessionId = null;
  let currentController = null;
  let streamingMsg = null;          // current assistant message div being written to
  let streamingText = "";           // accumulated text for the current assistant message
  let toolCards = new Map();        // tool_use_id -> card element
  let activePermissionRequest = null; // {id, cardEl}

  // Conversation persistence — mirrors what's rendered, restored on page reload.
  // Permission cards are intentionally NOT persisted (they're transient).
  const HISTORY_KEY = 'claudeWebHistory';
  const HISTORY_MAX = 200;
  let history = loadHistory();

  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function saveHistory() {
    try {
      const trimmed = history.slice(-HISTORY_MAX);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
      history = trimmed;
    } catch {}
  }
  function pushHistory(item) {
    history.push(item);
    saveHistory();
  }
  function clearHistory() {
    history = [];
    try { localStorage.removeItem(HISTORY_KEY); } catch {}
  }

  if (window.marked && window.marked.setOptions) {
    window.marked.setOptions({ breaks: true, gfm: true });
  }

  // ----- Banner / error helpers -----
  function showBanner(text, kind /* 'error' | 'info' */) {
    let banner = document.getElementById('global-banner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'global-banner';
      document.body.insertBefore(banner, document.body.firstChild);
    }
    banner.dataset.kind = kind || 'info';
    banner.style.cssText =
      'position:sticky;top:0;z-index:30;padding:11px 18px;font-size:13px;line-height:1.45;' +
      'font-family:var(--font-sans);text-align:center;border-bottom:1px solid;' +
      (kind === 'error'
        ? 'background:#fbeae5;color:#8a3422;border-color:#f0c9bd;'
        : 'background:#fef9e7;color:#7a5e0d;border-color:#f0e0a8;');
    banner.textContent = text;
    return banner;
  }
  function clearBanner() {
    const b = document.getElementById('global-banner');
    if (b) b.remove();
  }

  function appendErrorMsg(text) {
    ui.hideEmptyState();
    const div = document.createElement('div');
    div.className = 'msg msg-error';
    div.textContent = text;
    els.messages.appendChild(div);
    ui.scrollToBottom(true);
    return div;
  }

  // ----- Hard fail if opened via file:// -----
  if (location.protocol === 'file:') {
    showBanner(
      'This page must be opened through the local server. Run the launcher (ClaudeLocal.app or python3 server.py) and visit http://localhost:8765/',
      'error',
    );
    els.composerInput.disabled = true;
    els.composerInput.placeholder = 'Run the launcher first to enable chat...';
    els.sendBtn.disabled = true;
    els.settingsBtn.disabled = true;
    els.newChatBtn.disabled = true;
    return;
  }

  // ----- Config -----
  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      els.cfgBaseUrl.value = data.baseUrl || '';
      els.cfgToken.placeholder = data.hasToken ? 'saved — leave blank to keep' : 'sk-...';
      if (!data.hasToken || !data.baseUrl) {
        els.settingsDialog.showModal();
        return false;
      }
      clearBanner();
      return true;
    } catch (e) {
      showBanner('Could not load config from local server: ' + e.message, 'error');
      return false;
    }
  }

  async function saveConfig(payload) {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error('HTTP ' + r.status + (txt ? ': ' + txt.slice(0, 200) : ''));
    }
    return r.json();
  }

  // ----- Settings dialog submit -----
  els.settingsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {};
    const url = els.cfgBaseUrl.value.trim();
    const token = els.cfgToken.value.trim();
    if (url) payload.baseUrl = url;
    if (token) payload.token = token;

    if (!url) return showDialogError('Base URL is required.');

    const orig = els.cfgSave.textContent;
    els.cfgSave.disabled = true;
    els.cfgSave.textContent = 'Saving...';
    try {
      await saveConfig(payload);
      els.settingsDialog.close();
      els.cfgToken.value = '';
      clearDialogError();
      const ok = await loadConfig();
      if (ok && !sessionId) await ensureSession();
      clearBanner();
    } catch (err) {
      showDialogError('Could not save: ' + err.message);
    } finally {
      els.cfgSave.disabled = false;
      els.cfgSave.textContent = orig;
    }
  });

  function showDialogError(text) {
    let errEl = els.settingsForm.querySelector('.dialog-error');
    if (!errEl) {
      errEl = document.createElement('div');
      errEl.className = 'msg-error dialog-error';
      errEl.style.margin = '12px 0 0';
      const actions = els.settingsForm.querySelector('.dialog-actions');
      actions.parentNode.insertBefore(errEl, actions);
    }
    errEl.textContent = text;
  }
  function clearDialogError() {
    const e = els.settingsForm.querySelector('.dialog-error');
    if (e) e.remove();
  }

  // ----- Session lifecycle -----
  async function ensureSession() {
    const stored = localStorage.getItem('claudeWebSession');
    if (stored) {
      sessionId = stored;
      return sessionId;
    }
    const r = await fetch('/api/session', { method: 'POST' });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || ('HTTP ' + r.status));
    }
    const data = await r.json();
    sessionId = data.session_id;
    localStorage.setItem('claudeWebSession', sessionId);
    return sessionId;
  }

  async function newSession() {
    const old = sessionId;
    sessionId = null;
    localStorage.removeItem('claudeWebSession');
    if (old) {
      await fetch(`/api/session/${old}/new`, { method: 'POST' }).then(r => r.json()).then(d => {
        if (d.session_id) {
          sessionId = d.session_id;
          localStorage.setItem('claudeWebSession', sessionId);
        }
      }).catch(() => {});
    }
    if (!sessionId) await ensureSession();
  }

  // ----- New chat -----
  els.newChatBtn.addEventListener('click', async () => {
    if (currentController) currentController.abort();
    els.messages.innerHTML = '';
    toolCards.clear();
    streamingMsg = null;
    streamingText = '';
    activePermissionRequest = null;
    clearHistory();
    ui.showEmptyState();
    try {
      await newSession();
    } catch (e) {
      appendErrorMsg('Could not start a new session: ' + e.message);
    }
    els.composerInput.focus();
  });

  // ----- Render helpers -----
  function appendUserMsg(text, opts) {
    ui.hideEmptyState();
    const div = document.createElement('div');
    div.className = 'msg msg-user';
    div.textContent = text;
    els.messages.appendChild(div);
    ui.scrollToBottom(true);
    if (!opts || !opts.skipPersist) pushHistory({ kind: 'user', text });
  }

  function startAssistantMsg() {
    ui.hideEmptyState();
    const div = document.createElement('div');
    div.className = 'msg msg-assistant';
    const dots = document.createElement('div');
    dots.className = 'thinking-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    div.appendChild(dots);
    els.messages.appendChild(div);
    ui.scrollToBottom(true);
    streamingMsg = div;
    streamingText = '';
    return div;
  }

  function ensureAssistantMsg() {
    if (!streamingMsg) startAssistantMsg();
    return streamingMsg;
  }

  function renderAssistant(div, buffer, streaming) {
    let html;
    try { html = window.marked.parse(buffer); }
    catch { html = '<pre>' + escapeHtml(buffer) + '</pre>'; }
    div.innerHTML = html;
    if (streaming) {
      const last = div.lastElementChild || div;
      const caret = document.createElement('span');
      caret.className = 'streaming-caret';
      last.appendChild(caret);
    }
    div.querySelectorAll('pre').forEach((pre) => {
      if (!pre.querySelector('.copy-btn')) {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.textContent = 'Copy';
        pre.appendChild(btn);
      }
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  // ----- Tool cards -----
  function renderToolCard(toolUseId, name, input, opts) {
    ui.hideEmptyState();
    // Tool cards live as their own block in the messages stream, between assistant texts.
    streamingMsg = null;  // any subsequent text starts a new assistant block
    const card = document.createElement('div');
    card.className = 'msg tool-card tool-pending';
    card.dataset.toolUseId = toolUseId;
    card.innerHTML = `
      <div class="tool-card-header">
        <span class="tool-card-name">${escapeHtml(name)}</span>
        <span class="tool-card-status">pending</span>
      </div>
      <div class="tool-card-body">
        <pre class="tool-card-input">${escapeHtml(formatToolInput(name, input))}</pre>
      </div>
    `;
    els.messages.appendChild(card);
    toolCards.set(toolUseId, card);
    ui.scrollToBottom();
    if (!opts || !opts.skipPersist) pushHistory({ kind: 'tool_use', tool_use_id: toolUseId, name, input });
    return card;
  }

  function updateToolCardWithResult(toolUseId, content, isError, opts) {
    const card = toolCards.get(toolUseId);
    if (!card) return;
    card.classList.remove('tool-pending');
    card.classList.add(isError ? 'tool-error' : 'tool-done');
    const status = card.querySelector('.tool-card-status');
    if (status) status.textContent = isError ? 'error' : 'done';
    const body = card.querySelector('.tool-card-body');
    const result = document.createElement('details');
    result.className = 'tool-card-result';
    result.innerHTML = `
      <summary>Output</summary>
      <pre>${escapeHtml(String(content).slice(0, 8000))}${String(content).length > 8000 ? '\n[...truncated]' : ''}</pre>
    `;
    body.appendChild(result);
    ui.scrollToBottom();
    if (!opts || !opts.skipPersist) pushHistory({ kind: 'tool_result', tool_use_id: toolUseId, content: String(content).slice(0, 8000), is_error: !!isError });
  }

  function formatToolInput(name, input) {
    if (!input || typeof input !== 'object') return String(input ?? '');
    if (name === 'Bash' && typeof input.command === 'string') return input.command;
    if ((name === 'Read' || name === 'Glob' || name === 'Grep') && typeof input.file_path === 'string') return input.file_path;
    if (name === 'Edit' && typeof input.file_path === 'string') {
      return `${input.file_path}\n\n- ${String(input.old_string || '').slice(0, 200)}\n+ ${String(input.new_string || '').slice(0, 200)}`;
    }
    if (name === 'Write' && typeof input.file_path === 'string') return `${input.file_path}\n\n${String(input.content || '').slice(0, 400)}`;
    return JSON.stringify(input, null, 2);
  }

  // ----- Permission cards -----
  function renderPermissionCard(reqId, tool, input, summary) {
    ui.hideEmptyState();
    streamingMsg = null;
    const card = document.createElement('div');
    card.className = 'msg permission-card';
    card.dataset.reqId = reqId;
    card.innerHTML = `
      <div class="permission-card-header">
        <span class="permission-card-tool">${escapeHtml(tool)}</span>
        <span class="permission-card-prompt">wants to run</span>
      </div>
      <pre class="permission-card-summary">${escapeHtml(summary || formatToolInput(tool, input))}</pre>
      <details class="permission-card-details">
        <summary>Full input</summary>
        <pre>${escapeHtml(JSON.stringify(input, null, 2))}</pre>
      </details>
      <div class="permission-card-actions">
        <button type="button" class="btn btn-ghost" data-decision="deny">Deny</button>
        <button type="button" class="btn btn-ghost" data-decision="always">Allow always</button>
        <button type="button" class="btn btn-primary" data-decision="allow">Allow</button>
      </div>
    `;
    els.messages.appendChild(card);
    activePermissionRequest = { id: reqId, cardEl: card };
    ui.scrollToBottom(true);

    card.querySelectorAll('button[data-decision]').forEach((b) => {
      b.addEventListener('click', () => respondToPermission(reqId, b.dataset.decision));
    });
  }

  async function respondToPermission(reqId, decision) {
    const card = toolCards.get(reqId) || (activePermissionRequest && activePermissionRequest.cardEl) || null;
    const target = document.querySelector(`.permission-card[data-req-id="${reqId}"]`);
    if (target) {
      target.querySelectorAll('button').forEach(b => b.disabled = true);
      const status = document.createElement('div');
      status.className = 'permission-card-decided';
      status.textContent = decision === 'deny' ? 'Denied.' :
                           decision === 'always' ? `Allowed. Will auto-approve this tool for the rest of this chat.` :
                           'Allowed.';
      target.appendChild(status);
    }
    try {
      const r = await fetch('/api/permission', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, request_id: reqId, decision }),
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.error || ('HTTP ' + r.status));
      }
    } catch (e) {
      appendErrorMsg('Permission request failed: ' + e.message);
    }
    activePermissionRequest = null;
  }

  // ----- Send / stream -----
  els.composerForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (els.sendBtn.classList.contains('is-streaming')) {
      if (currentController) currentController.abort();
      return;
    }

    const text = els.composerInput.value.trim();
    if (!text) return;

    if (!sessionId) {
      try { await ensureSession(); }
      catch (err) {
        appendErrorMsg('Could not start session: ' + err.message);
        return;
      }
    }

    appendUserMsg(text);
    els.composerInput.value = '';
    ui.resizeInput();

    streamingMsg = null;
    streamingText = '';

    ui.setStreaming(true);
    currentController = new AbortController();

    try {
      const resp = await fetch('/api/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Session-Id': sessionId,
        },
        body: JSON.stringify({ message: text }),
        signal: currentController.signal,
      });

      if (!resp.ok) {
        let errText = '';
        try { errText = await resp.text(); } catch {}
        let parsed = errText;
        try {
          const j = JSON.parse(errText);
          parsed = typeof j.error === 'string' ? j.error : JSON.stringify(j.error || j);
        } catch {}
        if (resp.status === 400 && /session/i.test(String(parsed))) {
          // Stale session, recreate and retry once
          localStorage.removeItem('claudeWebSession');
          sessionId = null;
          await ensureSession();
          throw new Error('Session was reset. Please send the message again.');
        }
        throw new Error('Server returned ' + resp.status + ': ' + String(parsed).slice(0, 400));
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let leftover = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = leftover + decoder.decode(value, { stream: true });
        const events = chunk.split('\n\n');
        leftover = events.pop() || '';

        for (const ev of events) {
          if (!ev.trim()) continue;
          for (const line of ev.split('\n')) {
            if (!line.startsWith('data:')) continue;
            const dataStr = line.slice(5).trim();
            if (!dataStr) continue;
            let data;
            try { data = JSON.parse(dataStr); } catch { continue; }
            handleEvent(data);
          }
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        if (streamingMsg && streamingText) {
          renderAssistant(streamingMsg, streamingText + '\n\n*(stopped)*', false);
        } else if (streamingMsg) {
          streamingMsg.remove();
        }
      } else {
        if (streamingMsg && !streamingText) streamingMsg.remove();
        appendErrorMsg('Request failed: ' + err.message);
      }
    } finally {
      // Finalize any in-flight assistant message (drop the streaming caret)
      if (streamingMsg && streamingText) {
        renderAssistant(streamingMsg, streamingText, false);
        pushHistory({ kind: 'assistant', text: streamingText });
      }
      streamingMsg = null;
      streamingText = '';
      ui.setStreaming(false);
      currentController = null;
      els.composerInput.focus();
    }
  });

  // ----- SSE event dispatch -----
  function handleEvent(evt) {
    const t = evt.type;
    if (t === 'stream_event') {
      // Token-level deltas. Anthropic event lives in evt.event.
      const inner = evt.event || {};
      if (inner.type === 'content_block_delta' && inner.delta && inner.delta.type === 'text_delta') {
        ensureAssistantMsg();
        streamingText += inner.delta.text;
        renderAssistant(streamingMsg, streamingText, true);
        ui.scrollToBottom();
      }
    } else if (t === 'text_block') {
      // Canonical final text from the SDK. Use it to reconcile if streaming missed anything.
      ensureAssistantMsg();
      if (evt.text && evt.text.length >= streamingText.length) {
        streamingText = evt.text;
        renderAssistant(streamingMsg, streamingText, true);
      }
    } else if (t === 'tool_use') {
      // Finalize current assistant text block before showing the tool card
      if (streamingMsg && streamingText) {
        renderAssistant(streamingMsg, streamingText, false);
        pushHistory({ kind: 'assistant', text: streamingText });
      }
      streamingMsg = null;
      streamingText = '';
      renderToolCard(evt.id, evt.name, evt.input);
    } else if (t === 'tool_result') {
      updateToolCardWithResult(evt.tool_use_id, evt.content, evt.is_error);
    } else if (t === 'permission_request') {
      // Finalize current assistant text block before showing the permission card
      if (streamingMsg && streamingText) {
        renderAssistant(streamingMsg, streamingText, false);
      }
      streamingMsg = null;
      streamingText = '';
      renderPermissionCard(evt.id, evt.tool, evt.input, evt.summary);
    } else if (t === 'turn_result') {
      // End-of-turn metadata (usage, etc). Could surface later. For now, ignore.
    } else if (t === 'done') {
      // Server signals turn complete. Cleanup happens in `finally` of the fetch loop.
    } else if (t === 'error') {
      appendErrorMsg(evt.message || 'Unknown error');
      streamingMsg = null;
      streamingText = '';
    }
  }

  // ----- Heartbeat (keeps the server alive while a tab is open) -----
  function sendHeartbeat(goodbye) {
    const body = JSON.stringify({ session_id: sessionId, goodbye: !!goodbye });
    if (goodbye && navigator.sendBeacon) {
      try { navigator.sendBeacon('/api/heartbeat', new Blob([body], { type: 'application/json' })); return; } catch {}
    }
    fetch('/api/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
      keepalive: true,
    }).catch(() => {});
  }
  setInterval(() => sendHeartbeat(false), 15000);
  window.addEventListener('beforeunload', () => sendHeartbeat(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') sendHeartbeat(false);
  });

  // ----- History rehydration -----
  function rehydrateHistory() {
    if (!history || !history.length) return;
    ui.hideEmptyState();
    for (const item of history) {
      try {
        if (item.kind === 'user') appendUserMsg(item.text, { skipPersist: true });
        else if (item.kind === 'assistant') {
          const div = document.createElement('div');
          div.className = 'msg msg-assistant';
          els.messages.appendChild(div);
          renderAssistant(div, item.text, false);
        } else if (item.kind === 'tool_use') {
          renderToolCard(item.tool_use_id, item.name, item.input, { skipPersist: true });
        } else if (item.kind === 'tool_result') {
          updateToolCardWithResult(item.tool_use_id, item.content, item.is_error, { skipPersist: true });
        }
      } catch {}
    }
    ui.scrollToBottom(true);
  }

  // ----- Boot -----
  (async () => {
    rehydrateHistory();  // paint past conversation immediately, before any await
    const ok = await loadConfig();
    if (ok) {
      try { await ensureSession(); sendHeartbeat(false); }
      catch (e) { showBanner('Could not start a Claude session: ' + e.message, 'error'); }
    }
  })();
})();
</script>

</body>
</html>
